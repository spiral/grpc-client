---

name: 🔐 Security analysis

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [1.x]

# `head_ref` is the PR source branch on `pull_request` events and empty on `push`
# (falls back to `github.ref` = `refs/heads/<branch>`). Different PRs from different
# branches → different groups, so they never cross-cancel. Same PR pushed again
# → same group, the new run cancels the previous one.
#
# `cancel-in-progress` is only enabled on PR events: pushes to the default branch
# (1.x) keep their full history of CI runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  security-analysis:
    timeout-minutes: 4
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        php-version:
          - "8.5"
        dependencies:
          - highest
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: 🛠️ Setup problem matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: 🤖 Validate composer.json
        run: composer validate --ansi --strict

      # The audit needs only the resolved package set: skip the dload binaries (post-update-cmd)
      # and the plugins (llm/skills sync).
      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --no-scripts --no-plugins

      - name: 🐛 Check installed packages for security vulnerability advisories
        run: composer audit --ansi
