name: testo

on:
  pull_request:
    paths: &paths
      - 'src/**'
      - 'tests/**'
      - 'testo.php'
      - 'composer.json'
      - 'dload.xml'
      - '.github/workflows/testo.yml'
  push:
    branches: ['1.x']
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `composer update` fetches protoc, protoc-gen-php-grpc and grpcbin through dload (post-update-cmd);
  # the Acceptance suite runs against grpcbin.
  testo:
    uses: spiral/gh-actions/.github/workflows/testo.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      dependencies: >-
        ['lowest', 'highest']
      extensions: sockets, grpc
      ini-values: memory_limit=-1, zend.assertions=1
      # Without a driver the CodecovPlugin from testo.php stays inert.
      coverage: none
      dload-cache: true
      run: composer test:ci

  # One job is enough to report coverage.
  coverage:
    uses: spiral/gh-actions/.github/workflows/testo.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      php: >-
        ['8.5']
      dependencies: >-
        ['highest']
      extensions: sockets, grpc
      ini-values: memory_limit=-1, zend.assertions=1
      coverage: pcov
      dload-cache: true
      # `--` passes the `--coverage-clover` option appended by the reusable workflow on to testo.
      run: composer test:ci --
      codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
